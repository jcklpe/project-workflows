schema_version = 1

# Read this only for the collection adopted by the current project, never to infer a project from a global skill install.
[project]
name = "configs"
root = ".."

# Resolve document locations against the project root. Existing project instructions can override these seed defaults.
[documents]
readme = "README.md"
instructions = "AGENTS.md"
index = "TODO.md"
active_spikes = "docs/active-spikes"
scratch = "docs/scratch"
archive = "docs/archive"
policies = "docs/policies"
pinned_issues = "docs/pinned-issues.md"

# Adoption fills these with public-safe source metadata. The parent gitlink, not these fields, records the adopted commit.
[adoption]
upstream_url = "https://github.com/jcklpe/project-workflows.git"
upstream_branch = "main"
project_branch = "codex/project-configs"

# Optional documented checks; inspect them and project instructions before running commands.
[validation]
commands = []
