schema_version = 1

# Neutral defaults and legacy child-config example. New shared-source adoptions use the parent-root template.
# Never infer a project from this file in a global skill installation.
[project]
name = ""
root = ".."

# Resolve document locations against the project root. Existing project instructions can override these seed defaults.
[documents]
readme = "README.md"
instructions = "AGENTS.md"
index = "TODO.md"
active_spikes = "docs/active-spikes"
scratch = "docs/scratch"
archive = "docs/archive"
policies = "docs/policies" # Legacy policy location remains valid until deliberate migration.
agent_policies = "docs/agent-policies" # Agent-only opt-in index: policy.index.md; availability is not adoption.

# Adoption fills these with public-safe source metadata. The parent gitlink, not these fields, records the adopted commit.
[adoption]
upstream_url = ""
upstream_branch = ""
project_branch = ""

# Optional skill-name = parent-project-relative Markdown path; keep procedural notes outside this package.
[workflows]

# Optional collaboration selection. Local use needs no forge, platform tooling or credentials.
[coordination]
mode = "local"
repository = ""
# Optional project-owned reference naming setup/use skills and source/version. Empty allows human platform steps.
# Never store a command or secret here.
tooling = ""

# Optional documented checks; inspect them and project instructions before running commands.
[validation]
commands = []
